# Forgejo Actions lint for this Neovim config (self-hosted runner on git.daveynet.xyz).
# Follows the ws-sim / redextape setup: actions come from the code.forgejo.org mirror pinned by
# SHA, and every tool is installed as a step (no fat preinstalled image).
#
# This repo has nothing to build and no unit tests — it is config that a human loads. Four of the
# five jobs are static checks that run WITHOUT nvim: does every Lua file parse, is it formatted the
# way conform.nvim formats it on save, does luacheck find undeclared globals, is the Vimscript
# clean. The fifth (`boot`) installs every plugin at its locked version and proves nvim actually
# starts, which is the only check that exercises the config as a whole.
#
# `boot` is only viable because lazy-lock.json is tracked. While it was gitignored, every run
# resolved whatever upstream happened to be publishing that day, so an unrelated plugin's bad
# commit would have turned this red.

name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE*"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Parses every tracked Lua file without executing it. LuaJIT because that is the dialect nvim
  # embeds — `lua5.4` would accept goto/integer-division syntax that the real config would reject.
  lua-syntax:
    runs-on: docker                    # -> catthehacker/ubuntu:act-latest (node+git+curl)
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install LuaJIT
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends luajit
      - name: Parse every tracked Lua file
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/lua-syntax-check.sh

  # Gates on the SAME formatting conform.nvim applies on save. stylua.toml lives at the repo root
  # (not configs/) precisely so conform's `--search-parent-directories` finds it — a copy under
  # configs/ is invisible to both conform and this job.
  stylua:
    runs-on: docker
    env:
      # Pinned to an exact version and asset, checksummed BEFORE it reaches PATH — same rule as the
      # ws-sim nextest pin. Upstream ships no .sha256, so this hash was taken from the pinned
      # artifact itself: it proves nothing has changed since, not that it was honest on pin day.
      # Update BOTH values together when bumping.
      STYLUA_VERSION: 2.5.2
      STYLUA_SHA256: bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install stylua
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends unzip
          curl -fsSL -o /tmp/stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          # Explicit failure rather than relying on the runner's shell being `bash -e`: a checksum
          # check that cannot fail the step is not a checksum check.
          echo "${STYLUA_SHA256}  /tmp/stylua.zip" | sha256sum -c - \
            || { echo "stylua checksum mismatch — refusing to install" >&2; exit 1; }
          unzip -q -o /tmp/stylua.zip -d /usr/local/bin
          chmod +x /usr/local/bin/stylua
      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files '*.lua' | xargs stylua --check

  # Catches undeclared globals and unused locals. Rules live in .luacheckrc — notably `vim` and
  # `Snacks` are declared writable globals, without which this reports ~290 false positives.
  luacheck:
    runs-on: docker
    env:
      LUACHECK_VERSION: 1.2.0
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install luacheck
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends luarocks
          luarocks install luacheck "$LUACHECK_VERSION"
      - name: Lint Lua
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files '*.lua' | xargs luacheck

  # Covers the Vimscript under after/ and vimrc that the three Lua jobs never touch.
  vint:
    runs-on: docker
    env:
      VINT_VERSION: 0.3.21
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Installed into a venv rather than `pip install --break-system-packages`: that flag is a
      # pip 23+ option, so it hard-errors on an older image, while a venv works on every Ubuntu
      # regardless of whether PEP 668 marks the system environment as externally managed.
      - name: Install vint
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-venv
          python3 -m venv /tmp/vint-venv
          /tmp/vint-venv/bin/pip install --quiet "vim-vint==${VINT_VERSION}"
          echo /tmp/vint-venv/bin >> "$GITHUB_PATH"
      - name: Lint Vimscript
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files '*.vim' | xargs vint

  # The only job that runs the config rather than reading it: installs all 86 locked plugins into
  # a scratch prefix and asserts nvim starts with empty stderr. Measured at 2m50s locally on a warm
  # network; expect more on a cold runner.
  #
  # Pinned to the latest STABLE nvim, while the config is developed on 0.13.0-dev. That gap is the
  # point — it catches a nightly-only API landing in the config before it reaches another machine.
  # If you deliberately adopt a nightly feature, bump NVIM_VERSION (and its hash) or this goes red.
  boot:
    runs-on: docker
    env:
      # Neovim publishes no checksums alongside its release assets, so this hash was taken from the
      # pinned artifact itself: it proves nothing has changed since, not that it was honest on pin
      # day. Update BOTH values together when bumping.
      NVIM_VERSION: 0.12.4
      NVIM_SHA256: 012bf3fcac5ade43914df3f174668bf64d05e049a4f032a388c027b1ebd78628
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Neovim
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/v${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          echo "${NVIM_SHA256}  /tmp/nvim.tar.gz" | sha256sum -c - \
            || { echo "neovim checksum mismatch — refusing to install" >&2; exit 1; }
          tar xzf /tmp/nvim.tar.gz -C /opt
          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
      # blink.cmp builds a native fuzzy matcher (`build = "cargo build --release"`), and sniprun's
      # install.sh falls back to cargo when it has no prebuilt binary for the platform. Without a
      # toolchain both fail their build task and boot-check.sh reports them.
      - name: Install Rust (blink.cmp and sniprun build native code)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install plugins at locked versions and boot
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/boot-check.sh
